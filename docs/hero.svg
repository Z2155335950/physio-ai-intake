<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">理疗门店 AI 接诊工作台</title>
  <desc id="desc">从 PDF 接诊表到可核验草稿、门店知识、理疗师确认和偏好记忆的完整工作流</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062f2a"/>
      <stop offset="0.55" stop-color="#0b574b"/>
      <stop offset="1" stop-color="#123f42"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7f0d8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#edf5ef"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d4f3e7" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#001c18" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="70" r="210" fill="url(#glow)"/>
  <circle cx="1100" cy="370" r="150" fill="#43b99c" opacity="0.08"/>

  <g font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
    <text x="76" y="76" fill="#a6e6d2" font-size="16" font-weight="700" letter-spacing="3">PRIVACY-FIRST · HUMAN-IN-THE-LOOP</text>
    <text x="76" y="145" fill="#ffffff" font-size="48" font-weight="800">让接诊录入，不再吃掉理疗时间。</text>
    <text x="76" y="195" fill="#d8eee7" font-size="21">把 PDF 接诊表变成一份</text>
    <text x="76" y="229" fill="#ffffff" font-size="25" font-weight="700">可核验、有来源、会记住修改的 AI 草稿</text>

    <g transform="translate(76 275)">
      <rect width="118" height="38" rx="19" fill="#ffffff" opacity="0.12"/>
      <text x="59" y="25" text-anchor="middle" fill="#e8fff7" font-size="14">PDF 智能录入</text>
      <rect x="130" width="118" height="38" rx="19" fill="#ffffff" opacity="0.12"/>
      <text x="189" y="25" text-anchor="middle" fill="#e8fff7" font-size="14">来源可追溯</text>
      <rect x="260" width="118" height="38" rx="19" fill="#ffffff" opacity="0.12"/>
      <text x="319" y="25" text-anchor="middle" fill="#e8fff7" font-size="14">偏好可确认</text>
      <rect x="390" width="152" height="38" rx="19" fill="#ffffff" opacity="0.12"/>
      <text x="466" y="25" text-anchor="middle" fill="#e8fff7" font-size="14">数据留在门店</text>
    </g>

    <text x="76" y="365" fill="#8fc9b8" font-size="14">不做诊断 · 不承诺疗效 · AI 生成草稿，理疗师做最终确认</text>
  </g>

  <g transform="translate(720 74)" filter="url(#shadow)">
    <rect width="390" height="270" rx="24" fill="url(#paper)"/>
    <rect x="24" y="24" width="104" height="70" rx="12" fill="#e3f1ea"/>
    <path d="M47 43h58M47 57h47M47 71h34" stroke="#3a8574" stroke-width="5" stroke-linecap="round"/>
    <text x="150" y="49" fill="#133f36" font-size="15" font-weight="700">接诊表</text>
    <text x="150" y="73" fill="#77918a" font-size="12">PDF / 文档</text>

    <path d="M196 61h34" stroke="#70ad9e" stroke-width="3" stroke-linecap="round"/>
    <path d="m224 54 9 7-9 7" fill="none" stroke="#70ad9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="253" y="24" width="113" height="70" rx="12" fill="#f2e7c8"/>
    <circle cx="282" cy="51" r="12" fill="#d2a84f" opacity="0.55"/>
    <path d="M276 51h12M282 45v12" stroke="#8b641c" stroke-width="2.5" stroke-linecap="round"/>
    <text x="288" y="75" fill="#7d6026" font-size="12" text-anchor="middle">AI 草稿</text>

    <rect x="24" y="118" width="342" height="56" rx="13" fill="#102e29"/>
    <text x="43" y="142" fill="#9ddcc9" font-size="11" font-weight="700">门店知识助手</text>
    <text x="43" y="160" fill="#ffffff" font-size="13">风险提示 · 沟通话术 · 养护说明</text>
    <circle cx="329" cy="146" r="14" fill="#2b7565"/>
    <path d="m323 146 4 4 8-9" stroke="#d8fff3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="192" width="342" height="52" rx="13" fill="#e8f3ed" stroke="#bad8ce"/>
    <circle cx="50" cy="218" r="14" fill="#0f6557"/>
    <text x="50" y="223" fill="#ffffff" font-size="12" text-anchor="middle">理</text>
    <text x="74" y="214" fill="#21473e" font-size="13" font-weight="700">理疗师逐项核对</text>
    <text x="74" y="232" fill="#70887f" font-size="11">标黄低置信度 · 人工确认后入库</text>

    <g transform="translate(260 273)">
      <rect width="136" height="30" rx="15" fill="#d9efe5"/>
      <circle cx="18" cy="15" r="5" fill="#2c947b"/>
      <text x="31" y="20" fill="#286251" font-size="11" font-weight="700">SQLite · 本地保存</text>
    </g>
  </g>
</svg>
